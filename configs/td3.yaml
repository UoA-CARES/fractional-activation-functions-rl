algorithm:
  name: TD3
  actor_lr: 0.0003
  critic_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  policy_update_freq: 2
training:
  total_steps: 1000000
  start_steps: 1000
  batch_size: 256
  buffer_size: 1000000
  eval_every: 10000
  eval_episodes: 10
network:
  hidden_size: 256
  layers: 2
  activation: frelu
  alpha: 0.1
  placement: all-both
