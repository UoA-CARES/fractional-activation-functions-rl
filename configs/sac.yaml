algorithm:
  name: SAC
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  reward_scale: 1.0
  policy_update_freq: 1
  target_update_freq: 1
training:
  total_steps: 1000000
  start_steps: 1000
  batch_size: 256
  buffer_size: 1000000
  eval_every: 10000
  eval_episodes: 10
network:
  hidden_size: 256
  layers: 2
  activation: fswish
  alpha: 0.1
  placement: all-both
